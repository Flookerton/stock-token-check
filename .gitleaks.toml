# gitleaks configuration.
#
# The generic-api-key rule flags any high-entropy hex string. Public contract addresses are exactly
# that, and this repository is largely a list of them, so the rule fires on data meant to be public.
# The allowlist is deliberately narrow: it applies only to the token/feed map file and only to a
# full 40-hex-digit 0x address. Everything else is still scanned.

[extend]
useDefault = true

[allowlist]
description = "Public contract addresses in the token/feed map"
paths = ['''data/feed-map\.json''']
regexTarget = "match"
regexes = ['''0x[0-9a-fA-F]{40}''']
