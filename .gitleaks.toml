# gitleaks configuration.
#
# The default generic-api-key rule flags any high-entropy hex string. Public contract
# addresses are exactly that, and this repository is largely a list of them, so the
# default rule fires on data that is meant to be public.
#
# The allowlist below is deliberately narrow in the only way that matters: it permits
# the 40-hex-digit 0x address shape and nothing else. It is NOT scoped to any file.
# gitleaks treats allowlist entries as OR, so adding a `paths` entry here would exempt
# every line of that file — broader than intended. The regex is the only exemption.

[extend]
useDefault = true

[allowlist]
description = "Public 0x contract addresses (40 hex digits), repository-wide"
regexTarget = "match"
regexes = ['''0x[0-9a-fA-F]{40}''']
